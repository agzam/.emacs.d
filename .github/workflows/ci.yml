---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
  workflow_dispatch:

jobs:
  # Fast tier: check-parens + buttercup suites. No elpaca, network only on
  # a cold test-elpa cache (one buttercup install).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      - name: Cache test deps
        uses: actions/cache@v6
        with:
          path: .local/.cache/test-elpa
          key: test-elpa-${{ runner.os }}-${{ hashFiles('bb.edn') }}
      - run: bb ci

  # Full tier: boot the whole config with elpaca in a pty. Doubles as the
  # Linux-parity trial gate from MIGRATION.org. Elpaca is unpinned, so the
  # restore-keys fallback keeps package checkouts warm between key changes.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      - name: Cache elpaca checkouts and eln
        uses: actions/cache@v6
        with:
          path: |
            .local/elpaca
            .local/.cache/eln
          # yamllint disable-line rule:line-length
          key: elpaca-${{ runner.os }}-${{ hashFiles('init.el', 'modules/**/config.el', '.github/workflows/ci.yml') }}
          restore-keys: |
            elpaca-${{ runner.os }}-
      # Private package repos (khalendario.el) need credentials; the
      # fine-grained PAT has Contents:read on them.  The blanket rewrite
      # authenticates every github https clone - public ones included,
      # which also lifts anonymous rate limits.
      - name: Authenticate git for private package repos
        env:
          TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - run: bb smoke
