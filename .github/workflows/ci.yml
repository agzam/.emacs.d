---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
  workflow_dispatch:

jobs:
  # Fast tier: check-parens + buttercup suites. No elpaca, network only on
  # a cold test-elpa cache (one buttercup install).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        emacs-version: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      - name: Cache test deps
        uses: actions/cache@v6
        with:
          path: .local/.cache/test-elpa
          # yamllint disable-line rule:line-length
          key: test-elpa-${{ runner.os }}-${{ matrix.emacs-version }}-${{ hashFiles('bb.edn') }}
      - run: bb ci

  # Full tier: boot the whole config with elpaca in a pty, then drive real
  # flows through it. Doubles as the Linux-parity trial gate from
  # MIGRATION.org. Elpaca is unpinned, so the restore-keys fallback keeps
  # package checkouts warm between key changes. E2E rides this job rather
  # than its own: it needs the same boot, and the packages this job just
  # built make its second one cheap.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@master
        with:
          version: '30.1'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          bb: latest
      - name: Cache elpaca checkouts and eln
        uses: actions/cache@v6
        with:
          path: |
            .local/elpaca
            .local/.cache/eln
          # v2: v1 caches predate gptel-inline's standalone repo and hold a
          # build without its source dir, which fails every boot before a
          # good cache can be saved
          # yamllint disable-line rule:line-length
          key: elpaca-v2-${{ runner.os }}-${{ hashFiles('init.el', 'modules/**/config.el', '.github/workflows/ci.yml') }}
          restore-keys: |
            elpaca-v2-${{ runner.os }}-
      # Private package repos (khalendario.el) need credentials; the
      # fine-grained PAT has Contents:read on them.  The blanket rewrite
      # authenticates every github https clone - public ones included,
      # which also lifts anonymous rate limits.
      - name: Authenticate git for private package repos
        env:
          TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${TOKEN}@github.com/".insteadOf \
            "https://github.com/"
      - run: bb smoke
      - run: bb e2e
